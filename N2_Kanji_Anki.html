<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>N2 漢字 Anki | Shin Kanzen Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1a1108;--paper:#faf6ef;--paper2:#f0e8d8;--red:#c0392b;
  --gold:#c9a84c;--green:#27ae60;--blue:#2472a4;--shadow:rgba(26,17,8,.15);
  --radius:12px;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:"Hiragino Kaku Gothic Pro","Noto Sans JP","Yu Gothic",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(180,150,100,.07) 39px,rgba(180,150,100,.07) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(180,150,100,.04) 39px,rgba(180,150,100,.04) 40px);pointer-events:none;z-index:0}

.app{max-width:640px;margin:0 auto;padding:16px;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{text-align:center;padding:20px 0 16px;border-bottom:2px solid var(--gold);margin-bottom:20px;position:relative;flex-shrink:0}
header::after{content:"◆";color:var(--gold);position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:9px;background:var(--paper);padding:0 6px}
.htag{font-size:10px;letter-spacing:5px;color:var(--gold);margin-bottom:6px}
h1{font-size:26px;font-weight:900;letter-spacing:2px}
h1 span{color:var(--red)}
.hsub{font-size:11px;color:#999;letter-spacing:3px;margin-top:4px;font-family:monospace}

/* SCREENS */
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}

/* ===== SETUP SCREEN ===== */
.slabel{font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:10px;font-family:monospace}
.range-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.rb{background:var(--paper2);border:1.5px solid rgba(180,150,100,.3);border-radius:8px;padding:8px 2px;cursor:pointer;font-family:monospace;font-size:11px;color:var(--ink);text-align:center;transition:all .15s;position:relative;line-height:1.3;user-select:none}
.rb:hover{border-color:var(--gold);background:#ece5d6}
.rb.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rb.done::after{content:"✓";position:absolute;top:2px;right:4px;font-size:8px;color:var(--green)}
.rb.sel.done::after{color:var(--gold)}
.rb small{display:block;font-size:9px;color:#aaa;margin-top:2px}
.rb.sel small{color:#888}
.custom-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;background:var(--paper2);border:1.5px solid rgba(180,150,100,.3);border-radius:8px;padding:12px;flex-wrap:wrap}
.custom-row label{font-size:11px;color:#777;font-family:monospace;white-space:nowrap}
.custom-row input{width:68px;padding:6px 8px;border:1.5px solid rgba(180,150,100,.4);border-radius:6px;background:var(--paper);font-family:monospace;font-size:14px;color:var(--ink);text-align:center;-webkit-appearance:none}
.custom-row input:focus{outline:none;border-color:var(--gold)}
.cbtn{padding:8px 14px;background:var(--ink);color:var(--paper);border:none;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.cbtn:hover{background:#2d1f0e}
.mbtn{width:100%;padding:15px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);font-size:16px;cursor:pointer;letter-spacing:2px;transition:all .2s;font-weight:bold;flex-shrink:0}
.mbtn:hover{background:#2d1f0e;transform:translateY(-1px);box-shadow:0 4px 16px var(--shadow)}
.mbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.mode-row{display:flex;gap:6px;margin-bottom:14px}
.modbtn{flex:1;padding:9px 4px;border:1.5px solid rgba(180,150,100,.3);border-radius:6px;background:var(--paper2);font-size:11px;font-family:monospace;cursor:pointer;color:#888;transition:all .15s;white-space:nowrap}
.modbtn.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ===== STATS BAR ===== */
.stats{display:flex;gap:6px;margin-bottom:14px;flex-shrink:0}
.stat{flex:1;background:var(--paper2);border:1.5px solid rgba(180,150,100,.25);border-radius:8px;padding:8px 4px;text-align:center}
.stat .v{font-size:22px;font-weight:700;display:block;font-family:monospace}
.stat .l{font-size:9px;letter-spacing:2px;color:#999}
.stat.c .v{color:var(--green)}
.stat.w .v{color:var(--red)}
.stat.r .v{color:var(--blue)}
.prog-wrap{height:4px;background:var(--paper2);border-radius:2px;overflow:hidden;margin-bottom:18px;flex-shrink:0}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s ease;border-radius:2px}

/* ===== CARD ===== */
.card-area{flex:1;display:flex;flex-direction:column;justify-content:center;margin-bottom:16px;min-height:220px}
.card-wrap{perspective:1200px;cursor:pointer;touch-action:manipulation}
.card{width:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);border-radius:var(--radius)}
.card.flipped{transform:rotateY(180deg)}
.card.no-anim{transition:none!important}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;box-shadow:0 4px 24px var(--shadow);min-height:230px}
.front{background:var(--ink);color:var(--paper)}
.back{background:var(--paper);border:2px solid var(--gold);color:var(--ink);position:absolute;inset:0;transform:rotateY(180deg)}
.badge{font-size:9px;letter-spacing:3px;opacity:.5;margin-bottom:10px;font-family:monospace}
.fkanji{font-size:62px;font-weight:900;line-height:1;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.fhint{font-size:11px;opacity:.4;letter-spacing:2px;font-family:monospace}
.breading{font-size:30px;font-weight:700;color:var(--red);margin-bottom:10px}
.bsource{font-size:12px;color:#999;font-family:monospace;margin-top:12px;padding-top:12px;border-top:1px solid var(--paper2);width:100%;text-align:center}
.tap-hint{font-size:10px;letter-spacing:2px;color:#ccc;text-align:center;margin-bottom:10px;font-family:monospace;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ===== ANSWER BUTTONS ===== */
.ans-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex-shrink:0}
.abtn{padding:14px;border:none;border-radius:var(--radius);font-size:15px;cursor:pointer;transition:all .15s;font-weight:bold;touch-action:manipulation}
.abtn:active{transform:scale(.96)}
.awrong{background:#fde8e8;color:var(--red);border:2px solid #f5c6c6}
.awrong:hover{background:#fad0d0}
.acorrect{background:#e8f8ef;color:var(--green);border:2px solid #b8e8cb}
.acorrect:hover{background:#cff0df}
.ahidden{opacity:0;pointer-events:none}

/* ===== COMPLETE SCREEN ===== */
#complete-screen{text-align:center;padding:32px 16px}
.big-icon{font-size:64px;margin-bottom:12px;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.comp-title{font-size:24px;font-weight:900;margin-bottom:6px}
.comp-range{font-size:12px;color:#888;letter-spacing:2px;margin-bottom:20px;font-family:monospace}
.comp-stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px}
.cstat .big{font-size:38px;font-weight:700;display:block;font-family:monospace}
.cstat .sm{font-size:10px;color:#888;letter-spacing:2px}
.wrong-list{background:var(--paper2);border-radius:8px;padding:14px;margin-bottom:20px;text-align:left;max-height:180px;overflow-y:auto}
.wl-title{font-size:10px;letter-spacing:3px;color:var(--red);margin-bottom:10px;font-family:monospace}
.wl-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(180,150,100,.2);font-size:14px}
.wl-item:last-child{border:none}
.wl-read{color:#888;font-size:12px;font-family:monospace}
.btn-group{display:flex;flex-direction:column;gap:8px}
.actbtn{padding:13px;background:var(--ink);color:var(--paper);border:none;border-radius:8px;font-size:14px;cursor:pointer;letter-spacing:1px;transition:all .15s;font-weight:bold}
.actbtn:hover{background:#2d1f0e;transform:translateY(-1px)}
.actbtn.sec{background:transparent;color:var(--ink);border:2px solid rgba(180,150,100,.4)}
.actbtn.sec:hover{background:var(--paper2);transform:none}

/* ===== LOADING ===== */
#loading-screen{text-align:center;padding:60px 16px;justify-content:center;align-items:center}
.lk{font-size:72px;font-weight:900;animation:pulse 1.2s ease-in-out infinite;display:block;margin-bottom:16px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.93)}}
.lt{font-size:12px;color:#888;letter-spacing:2px;font-family:monospace;margin-bottom:20px}
.lpbar{height:3px;width:200px;background:var(--paper2);border-radius:2px;overflow:hidden}
.lpfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .4s;width:0%}

/* back btn */
.back-btn{background:none;border:none;font-size:11px;color:#999;cursor:pointer;letter-spacing:2px;font-family:monospace;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;transition:color .15s;flex-shrink:0}
.back-btn:hover{color:var(--ink)}

/* error */
.errbox{background:#fde8e8;border:1px solid #f5c6c6;border-radius:8px;padding:14px;font-size:13px;color:var(--red);margin-top:12px;line-height:1.6}

@media(max-width:400px){
  h1{font-size:22px}
  .fkanji{font-size:52px}
  .breading{font-size:24px}
  .range-grid{grid-template-columns:repeat(4,1fr)}
  .face{min-height:200px;padding:20px 16px}
}

/* ===== SEARCH ===== */
.search-wrap{margin-top:18px;padding-top:16px;border-top:1px solid rgba(180,150,100,.2)}
.search-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.search-inp{flex:1;padding:9px 12px;border:1.5px solid rgba(180,150,100,.4);border-radius:8px;background:var(--paper);font-size:16px;color:var(--ink);font-family:"Hiragino Kaku Gothic Pro","Noto Sans JP","Yu Gothic",sans-serif}
.search-inp:focus{outline:none;border-color:var(--gold)}
.search-inp::placeholder{color:#bbb;font-size:13px}
.sr-count{font-size:10px;font-family:monospace;letter-spacing:2px;color:#999;margin-bottom:8px;min-height:14px}
.search-results{max-height:360px;overflow-y:auto}
.sr-entry{background:var(--paper2);border:1.5px solid rgba(180,150,100,.25);border-radius:8px;padding:12px;margin-bottom:8px}
.sr-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(180,150,100,.2)}
.sr-num{font-size:10px;font-family:monospace;color:var(--gold);letter-spacing:2px}
.sr-kanji{font-size:26px;font-weight:900}
.sr-word{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(180,150,100,.1);font-size:14px}
.sr-word:last-child{border:none}
.sr-read{color:#888;font-size:12px;font-family:monospace}
.sr-hl{background:rgba(201,168,76,.35);border-radius:2px;padding:0 2px}
.sr-none{text-align:center;color:#999;font-size:12px;padding:20px;font-family:monospace;letter-spacing:2px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="htag">日本語能力試験 N2</div>
  <h1>漢字 <span>Anki</span></h1>
  <div class="hsub">SHIN KANZEN MASTER • 1046 KANJI</div>
</header>

<!-- SETUP -->
<div id="setup-screen" class="screen active">
  <div class="slabel">▸ STUDY MODE</div>
  <div class="mode-row" id="mode-row">
    <button class="modbtn act" onclick="setMode('w2r',this)">Word → Reading</button>
    <button class="modbtn" onclick="setMode('r2w',this)">Reading → Word</button>
    <button class="modbtn" onclick="setMode('mix',this)">Mixed</button>
  </div>
  <div class="slabel">▸ SELECT RANGE</div>
  <div class="range-grid" id="range-grid"></div>
  <div class="custom-row">
    <label>CUSTOM</label>
    <label>From</label>
    <input type="number" id="cf" value="1" min="1" max="1046">
    <label>To</label>
    <input type="number" id="ct" value="50" min="1" max="1046">
    <button class="cbtn" onclick="startCustom()">Go</button>
  </div>
  <button class="mbtn" id="start-btn" onclick="startStudy()" disabled>始めましょう — Start</button>
  <div id="setup-err" style="display:none" class="errbox"></div>
  <div class="search-wrap">
    <div class="slabel">▸ SEARCH KANJI / READING</div>
    <div class="search-row">
      <input class="search-inp" type="text" id="search-input" placeholder="漢字・ひらがな…" oninput="doSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="cbtn" onclick="clearSearch()">✕</button>
    </div>
    <div class="sr-count" id="search-count"></div>
    <div id="search-results"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading-screen" class="screen">
  <span class="lk" id="lk">漢</span>
  <div class="lt" id="lt">LOADING...</div>
  <div class="lpbar"><div class="lpfill" id="lpf"></div></div>
</div>

<!-- STUDY -->
<div id="study-screen" class="screen">
  <button class="back-btn" onclick="goBack()">← Range Select</button>
  <div class="stats">
    <div class="stat c"><span class="v" id="sc">0</span><span class="l">CORRECT</span></div>
    <div class="stat w"><span class="v" id="sw">0</span><span class="l">WRONG</span></div>
    <div class="stat r"><span class="v" id="sr">0</span><span class="l">LEFT</span></div>
  </div>
  <div class="prog-wrap"><div class="prog-bar" id="pb" style="width:0%"></div></div>
  <div class="card-area">
    <div class="card-wrap" id="card-wrap" onclick="flipCard()">
      <div class="card" id="card">
        <div class="face front">
          <div class="badge" id="fbadge">COMPOUND</div>
          <div class="fkanji" id="fk">—</div>
          <div class="fhint" id="fh">TAP TO FLIP</div>
        </div>
        <div class="face back">
          <div class="badge">READING</div>
          <div class="breading" id="br">—</div>
          <div class="bsource" id="bs">—</div>
        </div>
      </div>
    </div>
  </div>
  <div class="tap-hint" id="th">tap card to reveal</div>
  <div class="ans-row">
    <button class="abtn awrong ahidden" id="bw" onclick="answer(false)">✗ 間違い</button>
    <button class="abtn acorrect ahidden" id="bc" onclick="answer(true)">✓ 正解</button>
  </div>
</div>

<!-- COMPLETE -->
<div id="complete-screen" class="screen">
  <div class="big-icon" id="ci">🎌</div>
  <div class="comp-title" id="ctitle">Session Complete!</div>
  <div class="comp-range" id="crange"></div>
  <div class="comp-stats">
    <div class="cstat"><span class="big" id="fc" style="color:var(--green)">0</span><span class="sm">CORRECT</span></div>
    <div class="cstat"><span class="big" id="fw" style="color:var(--red)">0</span><span class="sm">WRONG</span></div>
    <div class="cstat"><span class="big" id="fp" style="color:var(--gold)">0%</span><span class="sm">SCORE</span></div>
  </div>
  <div id="wlwrap"></div>
  <div class="btn-group">
    <button class="actbtn" id="retry-btn" onclick="repeatWrong()" style="display:none">🔁 Retry Wrong Cards</button>
    <button class="actbtn" onclick="restartSession()">↺ Restart This Range</button>
    <button class="actbtn sec" onclick="goBack()">← Change Range</button>
  </div>
</div>

</div>

// ======== STATE ========
const RANGES=[
  [1,50],[51,100],[101,150],[151,200],[201,250],[251,300],
  [301,350],[351,400],[401,450],[451,500],[501,550],[551,600],
  [601,650],[651,700],[701,750],[751,800],[801,850],[851,900],
  [901,950],[951,1000],[1001,1046]
];

let studyMode='w2r'; // w2r | r2w | mix
let selRange=null;
let curRange=null;
let cards=[];
let idx=0;
let correct=0,wrong=0;
let wrongCards=[];
let flipped=false;
let lkTimer=null;
const LK=['漢','字','学','習','練','復','N2','覚'];
let lki=0;

// ======== STORAGE (localStorage) ========
const SK='n2kanji_done_v1';
function getProgress(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return {}}}
function saveProgress(key,cnt){const p=getProgress();p[key]=cnt;localStorage.setItem(SK,JSON.stringify(p))}

// ======== INIT ========
function init(){
  const grid=document.getElementById('range-grid');
  const prog=getProgress();
  RANGES.forEach(([a,b])=>{
    const key=a+'-'+b;
    const btn=document.createElement('button');
    btn.className='rb'+(prog[key]?' done':'');
    btn.id='rb-'+key;
    btn.innerHTML=a+'–'+b+'<small>'+(prog[key]?prog[key]+' cards':'')+'</small>';
    btn.onclick=()=>selectRange([a,b],btn,key);
    grid.appendChild(btn);
  });
}

function selectRange([a,b],btn,key){
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  selRange=[a,b];
  document.getElementById('start-btn').disabled=false;
  document.getElementById('setup-err').style.display='none';
}

function setMode(m,btn){
  studyMode=m;
  document.querySelectorAll('.modbtn').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
}

function startCustom(){
  const a=parseInt(document.getElementById('cf').value);
  const b=parseInt(document.getElementById('ct').value);
  if(isNaN(a)||isNaN(b)||a<1||b>1046||a>b){showErr('Enter valid range 1–1046');return;}
  curRange=[a,b];
  selRange=[a,b];
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  launch(a,b);
}

function startStudy(){
  if(!selRange)return;
  launch(selRange[0],selRange[1]);
}

function showErr(msg){
  const el=document.getElementById('setup-err');
  el.textContent=msg;el.style.display='block';
}

// ======== BUILD DECK ========
function launch(a,b){
  curRange=[a,b];
  showScreen('loading');
  document.getElementById('lpf').style.width='30%';
  lkTimer=setInterval(()=>{document.getElementById('lk').textContent=LK[lki++%LK.length]},700);

  setTimeout(()=>{
    const deck=[];
    for(let n=a;n<=b;n++){
      const entry=DB[n];
      if(!entry)continue;
      entry.compounds.forEach(({word,reading})=>{
        deck.push({word,reading,kanji:entry.kanji,num:n});
      });
    }
    shuffle(deck);
    const key=a+'-'+b;
    saveProgress(key,deck.length);
    // update button
    const btn=document.getElementById('rb-'+key);
    if(btn){btn.classList.add('done');btn.querySelector('small').textContent=deck.length+' cards';}

    document.getElementById('lpf').style.width='100%';
    clearInterval(lkTimer);
    setTimeout(()=>{startDeck(deck);},300);
  },150);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

// ======== STUDY ========
function startDeck(deck){
  cards=deck; idx=0; correct=0; wrong=0; wrongCards=[];
  showScreen('study');
  updateStats();
  showCard();
}

function showCard(){
  if(idx>=cards.length){showComplete();return;}
  const c=cards[idx];
  flipped=false;
  const card=document.getElementById('card');

  // Snap back instantly — no transition so the answer never flashes
  card.classList.add('no-anim');
  card.classList.remove('flipped');
  card.offsetHeight; // force reflow
  card.classList.remove('no-anim');

  document.getElementById('bw').classList.add('ahidden');
  document.getElementById('bc').classList.add('ahidden');
  document.getElementById('th').style.opacity='1';

  // Front always shows kanji word; back always shows reading
  document.getElementById('fbadge').textContent='KANJI WORD';
  document.getElementById('fk').textContent=c.word;
  document.getElementById('fh').textContent='TAP TO REVEAL READING';
  document.getElementById('br').textContent=c.reading;
  document.getElementById('bs').textContent='Source kanji: '+c.kanji+' (#'+c.num+')';
  updateStats();
}

function flipCard(){
  if(flipped)return;
  flipped=true;
  document.getElementById('card').classList.add('flipped');
  document.getElementById('th').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('bw').classList.remove('ahidden');
    document.getElementById('bc').classList.remove('ahidden');
  },300);
}

function answer(ok){
  if(!flipped)return;
  if(ok)correct++;
  else{wrong++;wrongCards.push(cards[idx]);}
  idx++;
  showCard();
}

function updateStats(){
  document.getElementById('sc').textContent=correct;
  document.getElementById('sw').textContent=wrong;
  document.getElementById('sr').textContent=Math.max(0,cards.length-idx);
  document.getElementById('pb').style.width=(cards.length>0?(idx/cards.length*100):0)+'%';
}

// ======== COMPLETE ========
function showComplete(){
  showScreen('complete');
  const total=correct+wrong;
  const pct=total>0?Math.round(correct/total*100):0;
  document.getElementById('fc').textContent=correct;
  document.getElementById('fw').textContent=wrong;
  document.getElementById('fp').textContent=pct+'%';
  document.getElementById('crange').textContent='KANJI #'+curRange[0]+'–'+curRange[1];
  const icon=pct>=90?'🏆':pct>=70?'⭐':pct>=50?'📚':'💪';
  const title=pct>=90?'素晴らしい！Outstanding!':pct>=70?'よくできました！Well done!':pct>=50?'もう少し！Keep going!':'練習が必要！Keep practicing!';
  document.getElementById('ci').textContent=icon;
  document.getElementById('ctitle').textContent=title;
  const wrap=document.getElementById('wlwrap');
  if(wrongCards.length>0){
    wrap.innerHTML='<div class="wrong-list"><div class="wl-title">REVIEW ('+wrongCards.length+')</div>'+
      wrongCards.map(c=>'<div class="wl-item"><span>'+c.word+'</span><span class="wl-read">'+c.reading+'</span></div>').join('')+'</div>';
    document.getElementById('retry-btn').style.display='';
  } else {
    wrap.innerHTML='';
    document.getElementById('retry-btn').style.display='none';
  }
}

function repeatWrong(){
  if(!wrongCards.length)return;
  startDeck(shuffle([...wrongCards]));
}

function restartSession(){launch(curRange[0],curRange[1]);}
function goBack(){clearInterval(lkTimer);showScreen('setup');}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(!document.getElementById('study-screen').classList.contains('active'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
  if(e.key==='ArrowRight'||e.key==='j'){answer(true);}
  if(e.key==='ArrowLeft'||e.key==='f'){answer(false);}
});

// Swipe support
let tx=0;
document.getElementById('card-wrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('card-wrap').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60&&flipped){if(dx>0)answer(true);else answer(false);}
},{passive:true});

// ======== SEARCH ========
function doSearch(q){
  q=q.trim();
  const res=document.getElementById('search-results');
  const cnt=document.getElementById('search-count');
  if(!q){res.innerHTML='';cnt.textContent='';return;}
  const hasKanji=/[一-龯㐀-䶿]/.test(q);
  const onlyKana=/^[ぁ-ゟ゠-ヿ]+$/.test(q);
  const matches=[];
  for(let n=1;n<=1046;n++){
    const e=DB[n];if(!e)continue;
    let comps=null;
    if(hasKanji){
      if(e.kanji===q){comps=e.compounds;}
      else{const f=e.compounds.filter(c=>c.word.includes(q));if(f.length)comps=f;}
    }
    if(onlyKana){
      const f=e.compounds.filter(c=>c.reading.includes(q));
      if(f.length&&!comps)comps=f;
    }
    if(comps)matches.push({entry:e,compounds:comps});
    if(matches.length>=30)break;
  }
  cnt.textContent=matches.length?matches.length+' RESULT'+(matches.length>1?'S':''):'';
  if(!matches.length){res.innerHTML='<div class="sr-none">— NO RESULTS —</div>';return;}
  res.innerHTML=matches.map(function(m){
    return '<div class="sr-entry"><div class="sr-head"><span class="sr-num">#'+m.entry.num+'</span><span class="sr-kanji">'+m.entry.kanji+'</span></div><div>'+
      m.compounds.map(function(c){return'<div class="sr-word"><span>'+hl(c.word,q)+'</span><span class="sr-read">'+hl(c.reading,q)+'</span></div>';}).join('')+
      '</div></div>';
  }).join('');
}
function hl(text,q){
  if(!q)return text;
  try{return text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),function(m){return'<span class="sr-hl">'+m+'</span>';});}
  catch(e){return text;}
}
function clearSearch(){
  document.getElementById('search-input').value='';
  document.getElementById('search-results').innerHTML='';
  document.getElementById('search-count').textContent='';
}

init();
</script>
